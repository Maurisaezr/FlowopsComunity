services:
  flowops:
    image: ghcr.io/maurisaezr/flowops-community:latest
    ports:
      - "${FLOWOPS_PORT:-5000}:5000"
    volumes:
      - flowops_community_data:/data
    environment:
      FLOWOPS_APP: /opt/flowops
      FLOWOPS_PORT: "5000"
    restart: unless-stopped

volumes:
  flowops_community_data:
